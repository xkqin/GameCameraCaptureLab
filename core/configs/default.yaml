# Backward-compatible Windows template. New Windows installs should copy
# core/configs/windows.yaml to core/configs/windows.local.yaml and edit the local file.
game:
  lua_path: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework/autorun/RE9FreeCam.lua"
  reframework_dir: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework"
  reframework_data_dir: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework/data"

lua_logger:
  control_file: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework/data/re9_pose_control.json"
  status_file: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework/data/re9_pose_status.json"
  pose_log_file: "D:/steam/steamapps/common/RESIDENT EVIL requiem BIOHAZARD requiem/reframework/data/re9_freecam_pose_log.csv"
  default_interval_sec: 0.033333
  backup_dir: "backups/lua"

trajectory:
  capture_root: "data/videos/trajectories"

obs:
  host: "localhost"
  port: 4455
  password: ""
  recording_output_dir: "data/videos"

video:
  fps: 2.0
  jpeg_quality: 95
  overwrite: false
  supported_video_extensions:
    - ".mp4"
    - ".mkv"
    - ".mov"
    - ".flv"
    - ".avi"

laion:
  repo_url: "https://github.com/LAION-AI/aesthetic-predictor.git"
  repo_dir: "core/third_party/aesthetic-predictor"
  model: "vit_l_14"
  device: "auto"
  batch_size: 32
  cache_dir: "~/.cache/re9_pose_recorder"
  hf_cache_dir: "core/third_party/huggingface_cache"

alignment:
  method: "nearest"
  max_time_diff_sec: 0.25

report:
  top_k: 50
  output_dir: "outputs"
  copy_top_frames: true
  smooth_window: 0

live_score:
  enabled: true
  interval_sec: 2.0
  summary_window_sec: 10.0
  segment_window_sec: 5.0
  screenshot_width: 512
  screenshot_height: 288
  screenshot_quality: 80

# Keep real webhook URLs and signing secrets in a local config or environment
# variables. Never commit them.
notifications:
  discord:
    webhook_url: ""
    mention: ""
    username: "Unified Camera Capture"
    timeout_sec: 5
  feishu:
    webhook_url: ""
    secret: ""
    mention_open_id: ""
    timeout_sec: 5

# Opt-in unattended recovery. The worker invokes the locally authenticated
# Codex CLI after a final GUI error.
automation:
  codex_recovery:
    enabled: false
    codex_bin: ""
    proxy_url: ""
    prompt: "请修复问题并且重新开始采集"
    cooldown_sec: 900
    timeout_sec: 3600
