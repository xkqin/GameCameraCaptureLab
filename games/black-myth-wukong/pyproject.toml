[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "black-myth-wukong-camera-capture-studio"
version = "0.1.0"
description = "Simple UUU pose, point-file, still capture, and trajectory capture UI for Black Myth: Wukong."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bmw-capture-studio = "bmw_capture_studio.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
