[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-game-camera-capture-studio"
version = "0.2.0"
description = "Unified free-camera, absolute-pose, still-capture, and trajectory-capture UI for supported games."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10",
    "obsws-python>=1.7",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unified-camera-studio = "bmw_capture_studio.__main__:main"
bmw-capture-studio = "bmw_capture_studio.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
