idth="2" fill="none"/></g><g transform="translate(858 465) scale(0.9)"><circle cx="0" cy="0" r="4" fill="#12233A" stroke="none" stroke-width="1"/><line x1="0" y1="0" x2="52" y2="0" stroke="#EF4444" stroke-width="3" marker-end="url(#arrow-red)" fill="none"/><line x1="0" y1="0" x2="0" y2="-52" stroke="#22C55E" stroke-width="3" marker-end="url(#arrow-green)" fill="none"/><line x1="0" y1="0" x2="-34" y2="30" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue-small)" fill="none"/><text x="60" y="6" font-size="18" fill="#EF4444" font-weight="400" text-anchor="start" font-family="Times New Roman" font-style="italic">x</text><text x="-4" y="-62" font-size="18" fill="#22C55E" font-weight="400" text-anchor="start" font-family="Times New Roman" font-style="italic">z</text><text x="-49" y="44" font-size="18" fill="#2563EB" font-weight="400" text-anchor="start" font-family="Times New Roman" font-style="italic">y</text></g><rect x="620" y="552" width="215" height="75" rx="12" fill="#E8F5FB" stroke="#CAD9E5" stroke-width="1.1"/><text x="636" y="580" font-size="18" fill="#0D7993" font-weight="700" text-anchor="start" font-family="Consolas">position</text><text x="636" y="607" font-size="17" fill="#405A72" font-weight="400" text-anchor="start" font-family="Consolas">x, y, z</text><text x="818" y="580" font-size="13" fill="#75899E" font-weight="700" text-anchor="end" font-family="Times New Roman">required</text><rect x="855" y="552" width="215" height="75" rx="12" fill="#EEF7F2" stroke="#CAD9E5" stroke-width="1.1"/><text x="871" y="580" font-size="18" fill="#287A62" font-weight="700" text-anchor="start" font-family="Consolas">rotation</text><text x="871" y="607" font-size="17" fill="#405A72" font-weight="400" text-anchor="start" font-family="Consolas">yaw, pitch, roll</text><text x="1053" y="580" font-size="13" fill="#75899E" font-weight="700" text-anchor="end" font-family="Times New Roman">required</text><rect x="620" y="646" width="215" height="75" rx="12" fill="#F3EFFF"