<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Coordinate-explicit camera pose contract</title>
<desc id="desc">Data representation diagram showing engine-native coordinate systems mapped into a versioned camera pose and composed into point sets and trajectories.</desc>

