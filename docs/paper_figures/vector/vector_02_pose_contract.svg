<text x="70" y="70" font-size="18" fill="#087EA4" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2.5">FIGURE 02 / DATA REPRESENTATION</text><text x="70" y="116" font-size="40" fill="#10233F" font-weight="700" text-anchor="start" font-family="Times New Roman">A Coordinate-Explicit Camera Pose Contract</text><text x="70" y="151" font-size="21" fill="#556A86" font-weight="400" text-anchor="start" font-family="Times New Roman">Every adapter declares its native coordinates before mapping position, orientation, and field of view.</text><line x1="70" y1="174" x2="1530" y2="174" stroke="#D4DEE9" stroke-width="1" fill="none"/><text x="80" y="222" font-size="17" fill="#55708B" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">ENGINE-NATIVE INPUT</text><text x="620" y="222" font-size="17" fill="#55708B" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">CAMERA-POSE/V1</text><text x="1240" y="222" font-size="17" fill="#55708B" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">COMPOSABLE CONTAINERS</text><rect x="70" y="264" width="410" height="132" rx="16" fill="#EAF7FB" stroke="#CBD9E5" stroke-width="1.3"/><text x="96" y="300" font-size="23" fill="#152D49" font-weight="700" text-anchor="start" font-family="Times New Roman">Engine A</text><rect x="342" y="278" width="112" height="34" rx="17" fill="#FFFFFF" stroke="#C6D6E2" stroke-width="1"/><text x="398.0" y="301" font-size="17" fill="#1185A0" font-weight="600" text-anchor="middle" font-family="Times New Roman">Z-UP</text><text x="96" y="337" font-size="18" fill="#536E87" font-weight="400" text-anchor="start" font-family="Consolas">handedness: left-handed</text><text x="96" y="365" font-size="18" fill="#536E87" font-weight="400" text-anchor="start" font-family="Consolas">angle_unit: degrees</text><g transform="translate(410 362) scale(0.42)"><circle cx="0" cy="0" r="4" fill="#12233A"