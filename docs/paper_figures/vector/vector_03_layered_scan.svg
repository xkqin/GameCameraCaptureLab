<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Boundary-aware layered still-scan planning</title>
<desc id="desc">A 3D sampling schematic where sparse boundary points define a scene volume, six layers place camera positions, and multiple view directions produce still scans.</desc>

