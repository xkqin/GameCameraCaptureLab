<text x="70" y="70" font-size="18" fill="#087EA4" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2.5">FIGURE 01 / SYSTEM OVERVIEW</text><text x="70" y="116" font-size="40" fill="#10233F" font-weight="700" text-anchor="start" font-family="Times New Roman">Unified Multi-Game Camera Capture Framework</text><text x="70" y="151" font-size="21" fill="#556A86" font-weight="400" text-anchor="start" font-family="Times New Roman">Dynamic adapters map engine-specific camera control to shared pose, point-set, and trajectory contracts.</text><line x1="70" y1="174" x2="1530" y2="174" stroke="#D4DEE9" stroke-width="1" fill="none"/><text x="82" y="222" font-size="17" fill="#51708F" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">GAME ADAPTERS</text><text x="580" y="222" font-size="17" fill="#51708F" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">SHARED CAPTURE CORE</text><text x="1240" y="222" font-size="17" fill="#51708F" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">DATA PRODUCTS</text><rect x="70" y="258" width="390" height="100" rx="16" fill="#E9F8F3" stroke="#CEDCE8" stroke-width="1.5"/><rect x="70" y="258" width="10" height="100" rx="5" fill="#17815F" stroke="none" stroke-width="1"/><text x="102" y="294" font-size="24" fill="#132A46" font-weight="700" text-anchor="start" font-family="Times New Roman">RE Engine</text><text x="102" y="326" font-size="19" fill="#61758D" font-weight="400" text-anchor="start" font-family="Times New Roman">Lua pose bridge</text><rect x="302" y="276" width="138" height="34" rx="17" fill="#FFFFFF" stroke="#C7D6E3" stroke-width="1"/><text x="371.0" y="299" font-size="17" fill="#17815F" font-weight="600" text-anchor="middle" font-family="Times New Roman">STABLE</text><rect x="70" y="384" width="390" height="100" rx="16" fill="#FFF4E6" stroke="#CEDCE8" stroke-width="1.5"/><rect x="70" y="384" width=