<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Unified multi-game camera capture framework</title>
<desc id="desc">Architecture overview showing dynamically discovered game adapters, shared versioned camera schemas, capture orchestration, and dataset products.</desc>

  <defs>
