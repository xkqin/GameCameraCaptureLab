99">v1</tspan></text><text x="612" y="570" font-size="13.5" fill="#5B718A" font-weight="400" text-anchor="start" font-family="Times New Roman"><tspan x="612" dy="0">XYZ + rotation</tspan><tspan x="612" dy="15.93">quaternion (opt.)</tspan><tspan x="612" dy="15.93">field of view</tspan></text><rect x="756" y="448" width="146" height="174" rx="14" fill="#EEF9F4" stroke="#C8D7E4" stroke-width="1.2"/><circle cx="783" cy="476" r="10" fill="#268568" stroke="none" stroke-width="1"/><text x="801" y="483" font-size="20" fill="#172E4A" font-weight="700" text-anchor="start" font-family="Times New Roman">Point set</text><text x="774" y="521" font-size="13.5" fill="#268568" font-weight="700" text-anchor="start" font-family="Consolas"><tspan x="774" dy="0">camera-point-set</tspan><tspan x="774" dy="15.524999999999999">v1</tspan></text><text x="774" y="570" font-size="13.5" fill="#5B718A" font-weight="400" text-anchor="start" font-family="Times New Roman"><tspan x="774" dy="0">scene poses</tspan><tspan x="774" dy="15.93">explicit units</tspan><tspan x="774" dy="15.93">and coordinates</tspan></text><rect x="918" y="448" width="146" height="174" rx="14" fill="#F3EFFF" stroke="#C8D7E4" stroke-width="1.2"/><circle cx="945" cy="476" r="10" fill="#6655B7" stroke="none" stroke-width="1"/><text x="963" y="483" font-size="20" fill="#172E4A" font-weight="700" text-anchor="start" font-family="Times New Roman">Trajectory</text><text x="936" y="521" font-size="13.5" fill="#6655B7" font-weight="700" text-anchor="start" font-family="Consolas"><tspan x="936" dy="0">camera-trajectory</tspan><tspan x="936" dy="15.524999999999999">v1</tspan></text><text x="936" y="570" font-size="13.5" fill="#5B718A" font-weight="400" text-anchor="start" font-family="Times New Roman"><tspan x="936" dy="0">time-ordered</tspan><tspan x="936" dy="15.93">pose keyframes</tspan></text><line x1="839" y1="625" x2="839" y2="655" stroke="#169BB8" stroke-width="3" marker-end="url(#arrow)" fill="none"/><rect x="595" y="668" width="488" height="63" rx="14" fill="#122F4B" stroke="#122F4B" stroke-width="1"/><text x="839" y="695" font-size="19" fill="#E9F8FD" font-weight="700" text-anchor="middle" font-family="Times New Roman" letter-spacing="1.2">PLAN  -&gt;  CONTROL  -&gt;  CAPTURE  -&gt;  VALIDATE</text><text x="839" y="719" font-size="15" fill="#A8C5D7" font-weight="400" text-anchor="middle" font-family="Times New Roman">engine-neutral orchestration with adapter-specific execution</text><path d="M 1113 449 C 1160 449 1165 449 1207 449" fill="none" stroke="#169BB8" stroke-width="4" marker-end="url(#arrow)"/><rect x="1220" y="279" width="310" height="118" rx="16" fill="#EAF7FB" stroke="#CAD8E4" stroke-width="1.3"/><circle cx="1254" cy="313" r="14" fill="#0A809A" stroke="none" stroke-width="1"/><text x="1280" y="321" font-size="23" fill="#142C48" font-weight="700" text-anchor="start" font-family="Times New Roman">Still scans</text><text x="1254" y="361" font-size="17" fill="#63778F" font-weight="400" text-anchor="start" font-family="Times New Roman">multi-view RGB frames</text><rect x="1450" y="348" width="20" height="14" rx="2" fill="#A8DCE7" stroke="none" stroke-width="1"/><rect x="1477" y="348" width="20" height="14" rx="2" fill="#A8DCE7" stroke="none" stroke-width="1"/><rect x="1450" y="368" width="20" height="14" rx="2" fill="#A8DCE7" stroke="none" stroke-width="1"/><rect x="1477" y="368" width="20" height="14" rx="2" fill="#A8DCE7" stroke="none" stroke-width="1"/><rect x="1220" y="429" width="310" height="118" rx="16" fill="#F1EEFF" stroke="#CAD8E4" stroke-width="1.3"/><circle cx="1254" cy="463" r="14" fill="#6654B6" stroke="none" stroke-width="1"/><text x="1280" y="471" font-size="23" fill="#142C48" font-weight="700" text-anchor="start" font-family="Times New Roman">Trajectory clips</text><text x="1254" y="511" font-size="17" fill="#63778F" font-weight="400" text-anchor="start" font-family="Times New Roman">time-aligned frame sequences</text><path d="M 1445 512 C 1460 484 1490 532 1511