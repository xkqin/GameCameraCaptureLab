    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#22C55E"/>
    </marker>
    <marker id="arrow-blue-small" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
