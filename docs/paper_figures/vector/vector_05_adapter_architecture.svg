-width="1"/><text x="292.0" y="693" font-size="17" fill="#6754B8" font-weight="600" text-anchor="middle" font-family="Times New Roman">EXPERIMENTAL</text><text x="378" y="693" font-size="15" fill="#6754B8" font-weight="700" text-anchor="start" font-family="Consolas">game.json</text><path d="M 530 649.0 C 650 649.0 650 547 650 547" fill="none" stroke="#6754B8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="1070" y="574" width="340" height="150" rx="18" fill="#EDF5FA" stroke="#C6D7E3" stroke-width="1.5"/><rect x="1070" y="574" width="9" height="150" rx="4" fill="#39758F" stroke="none" stroke-width="1"/><text x="1100" y="614" font-size="24" fill="#152E4A" font-weight="700" text-anchor="start" font-family="Times New Roman">Future adapter N</text><text x="1100" y="648" font-size="18" fill="#5B7188" font-weight="400" text-anchor="start" font-family="Times New Roman">manifest + bridge</text><rect x="1100" y="670" width="144" height="34" rx="17" fill="#FFFFFF" stroke="#CBD8E3" stroke-width="1"/><text x="1172.0" y="693" font-size="17" fill="#39758F" font-weight="600" text-anchor="middle" font-family="Times New Roman">PLUG-IN</text><text x="1258" y="693" font-size="15" fill="#39758F" font-weight="700" text-anchor="start" font-family="Consolas">game.json</text><path d="M 1070 649.0 C 950 649.0 950 547 950 547" fill="none" stroke="#39758F" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="725.0" y="234" width="150" height="34" rx="17" fill="#153A57" stroke="none" stroke-width="1"/><text x="800.0" y="257" font-size="17" fill="#EAF8FC" font-weight="600" text-anchor="middle" font-family="Times New Roman">CAPABILITIES</text><rect x="955.0" y="453" width="110" height="34" rx="17" fill="#153A57" stroke="none" stroke-width="1"/><text x="1010.0" y="476" font-size="17" fill="#EAF8FC" font-weight="600" text-anchor="middle" font-family="Times New Roman">ACTIONS</text><rect x="745.0" y="682" width="110" height="34" rx="17" fill="#153A57" stroke="none" stroke-width="1"/><text x="800.0" y="705" font-size="17" fill="#EAF8FC" font-weight="600" text-anchor="middle" font-family="Times New Roman">EXAMPLES</text><rect x="540.0" y="453" width="100" height="34" rx="17" fill="#153A57" stroke="none" stroke-width="1"/><text x="590.0" y="476" font-size="17" fill="#EAF8FC" font-weight="600" text-anchor="middle" font-family="Times New Roman">DOCS</text><text x="70" y="217" font-size="17" fill="#55708B" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">ADAPTER CONTRACT</text><text x="1530" y="217" font-size="17" fill="#55708B" font-weight="700" text-anchor="end" font-family="Times New Roman" letter-spacing="2">DYNAMIC DISCOVERY</text><rect x="570" y="753" width="460" height="63" rx="14" fill="#14314D" stroke="none" stroke-width="1"/><text x="800" y="780" font-size="19" fill="#F1F8FC" font-weight="700" text-anchor="middle" font-family="Consolas">games/*/game.json  -&gt;  registry  -&gt;  launcher</text><text x="800" y="805" font-size="15" fill="#ABC2D2" font-weight="400" text-anchor="middle" font-family="Times New Roman">adding an adapter does not modify the shared hub</text><circle cx="606" cy="263" r="14" fill="#F7F9FC" stroke="#7FA5B9" stroke-width="2" opacity="0.9"/><line x1="600" y1="263" x2="612" y2="263" stroke="#5A859A" stroke-width="2" fill="none"/><line x1="606" y1="257" x2="606" y2="269" stroke="#5A859A" stroke-width="2" fill="none"/><circle cx="994" cy="263" r="14" fill="#F7F9FC" stroke="#7FA5B9" stroke-width="2" opacity="0.9"/><line x1="988" y1="263" x2="1000" y2="263" stroke="#5A859A" stroke-width="2" fill="none"/><line x1="994" y1="257" x2="994" y2="269" stroke="#5A859A" stroke-width="2" fill="none"/><circle cx="606" cy="690" r="14" fill="#F7F9FC" stroke="#7FA5B9" stroke-width="2" opacity="0.9"/><line x1="600" y1="690" x2="612" y2="690" stroke="#5A859A" stroke-width="2" fill="none"/><line x1="606" y1="684" x2="606" y2="696" stroke="#5A859A" stroke-width="2" fill="none"/><circle cx="994" cy="690" r="14" fill="#F7F9FC" stroke="#7FA5B9" stroke-width="2" opacity="0.9"/><line x1="988" y1="690" x2="1000" y2="690" stroke="#5A859A" stroke-width="2" fill="none"/><line x1="994" y1="684" x2="994" y2="696" stroke="#5A859A" stroke-width="2" fill="none"/><line x1="70" y1="846" x2="1530" y2="846" stroke="#D7E1EC" stroke-width="1" fill="none"/><text x="70" y="875" font-size="14" fill="#657B95" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2">GAME CAMERA CAPTURE LAB</text><text x="1530" y="875" font-size="15" fill="#657B95" font-weight="400" text-anchor="end" font-family="Times New Roman">Manifest-driven adapter system</text>
