<text x="70" y="70" font-size="18" fill="#087EA4" font-weight="700" text-anchor="start" font-family="Times New Roman" letter-spacing="2.5">FIGURE 05 / EXTENSIBILITY</text><text x="70" y="116" font-size="40" fill="#10233F" font-weight="700" text-anchor="start" font-family="Times New Roman">An Extensible Adapter Architecture</text><text x="70" y="151" font-size="21" fill="#556A86" font-weight="400" text-anchor="start" font-family="Times New Roman">New games are discovered from manifests; the launcher never hard-codes game count or engine branches.</text><line x1="70" y1="174" x2="1530" y2="174" stroke="#D4DEE9" stroke-width="1" fill="none"/><circle cx="800" cy="470" r="166" fill="#E9F6FA" stroke="#79BCCE" stroke-width="2.5"/><circle cx="800" cy="470" r="126" fill="#FFFFFF" stroke="#B5D3DE" stroke-width="1.5"/><text x="800" y="431" font-size="18" fill="#26758D" font-weight="700" text-anchor="middle" font-family="Times New Roman" letter-spacing="2">SHARED</text><text x="800" y="470" font-size="31" fill="#14314D" font-weight="700" text-anchor="middle" font-family="Times New Roman">Capture Core</text><text x="800" y="504" font-size="18" fill="#5E748B" font-weight="400" text-anchor="middle" font-family="Times New Roman">registry + schemas</text><text x="800" y="529" font-size="18" fill="#5E748B" font-weight="400" text-anchor="middle" font-family="Times New Roman">validation + launcher</text><rect x="190" y="255" width="340" height="150" rx="18" fill="#EAF8F3" stroke="#C6D7E3" stroke-width="1.5"/><rect x="190" y="255" width="9" height="150" rx="4" fill="#258368" stroke="none" stroke-width="1"/><text x="220" y="295" font-size="24" fill="#152E4A" font-weight="700" text-anchor="start" font-family="Times New Roman">RE Engine adapter</text><text x="220" y="329" font-size="18" fill="#5B7188" font-weight="400" text-anchor="start" font-family="Times New Roman">Lua bridge</text><rect x="220" y="351" width="144" height="34" rx="17" fill="#FFFFFF" stroke="#CBD8E3" stroke-width="1"/><t