<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Trajectory execution with measured-pose feedback</title>
<desc id="desc">A trajectory-control diagram showing keyframes, interpolation, atomic setPose when available, relative pose feedback as a fallback, and synchronized frame capture.</desc>

