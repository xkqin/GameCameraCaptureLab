xt x="707" y="871" font-size="15" fill="#607189" font-weight="400" text-anchor="start" font-family="Arial">layered viewpoints with reproducible orientation sets</text><line x1="1327" y1="748" x2="1327" y2="788" stroke="#0A7EAA" stroke-width="2" marker-end="url(#arrow-blue)" fill="none"/><rect x="1182" y="802" width="430" height="92" fill="#F4FAFD" stroke="#B4DCE8" stroke-width="1.4" rx="14"/><text x="1207" y="840" font-size="22" fill="#0B6888" font-weight="700" text-anchor="start" font-family="Times New Roman">Trajectory clips</text><text x="1207" y="871" font-size="15" fill="#607189" font-weight="400" text-anchor="start" font-family="Arial">keyframes, timing, source evidence, and manifests</text><line x1="70" y1="936" x2="1730" y2="936" stroke="#D5E0E9" stroke-width="1" fill="none"/><text x="70" y="963" font-size="13" fill="#71839A" font-weight="700" text-anchor="start" font-family="Arial" letter-spacing="1.8">GAME CAMERA CAPTURE LAB</text><text x="1730" y="963" font-size="14" fill="#71839A" font-weight="400" text-anchor="end" font-family="Arial">Pure vector method figure</text></svg>
