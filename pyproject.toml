[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-camera-capture-lab"
version = "0.2.0"
description = "Multi-game camera pose, point, still-scan, and trajectory capture toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer",
  "rich",
  "pyyaml",
  "pandas",
  "numpy",
  "pillow",
  "opencv-python",
  "torch",
  "torchvision",
  "open_clip_torch",
  "tqdm",
  "matplotlib",
  "jinja2",
  "obsws-python",
  "requests",
]

[project.scripts]
game-camera-capture = "game_camera_capture_lab.hub:main"
game-camera-registry-check = "game_camera_capture_lab.validate:main"
re9-pose-recorder = "re9_pose_recorder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
re9_pose_recorder = ["py.typed"]
