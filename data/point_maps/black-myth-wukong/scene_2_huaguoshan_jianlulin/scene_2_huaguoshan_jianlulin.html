  function resolvedColor(variableName) {
    const probe = document.createElement('span');
    probe.style.color = `var(${variableName})`;
    probe.style.display = 'none';
    root.appendChild(probe);
    const value = getComputedStyle(probe).color;
    probe.remove();
    return value;
  }

  function triangleEdges(faces, x, y, z) {
    const edgeX = [];
    const edgeY = [];
    const edgeZ = [];
    const seen = new Set();
    for (const [a, b, c] of faces) {
      for (const [u, v] of [[a, b], [b, c], [c, a]]) {
        const key = u < v ? `${u}:${v}` : `${v}:${u}`;
        if (seen.has(key)) continue;
        seen.add(key);
        edgeX.push(x[u], x[v], null);
        edgeY.push(y[u], y[v], null);
        edgeZ.push(z[u], z[v], null);
      }
    }
    return {x: edgeX, y: edgeY, z: edgeZ};
  }

  function representativeRays(points, length) {
    const rayX = [];
    const rayY = [];
    const rayZ = [];
    for (const point of points) {
      const yaw = point[5] * Math.PI / 180;
      const pitch = point[6] * Math.PI / 180;
      const horizontal = Math.cos(pitch);
      const dx = Math.sin(yaw) * horizontal * length;
      const dy = Math.cos(yaw) * horizontal * length;
      const dz = Math.sin(pitch) * length;
      rayX.push(point[0], point[0] + dx, null);
      rayY.push(point[1], point[1] + dy, null);
      rayZ.push(point[2], point[2] + dz, null);
    }
    return {x: rayX, y: rayY, z: rayZ};
  }

  function draw() {
    const narrow = root.clientWidth < 500;
    const foreground = resolvedColor('--foreground');
    const muted = resolvedColor('--muted-foreground');
    const border = resolvedColor('--border');
    const hullColor = resolvedColor('--viz-series-1');
    const rayColor = resolvedColor('--viz-series-6');
    const layerColors = [1, 2, 3, 4, 5].map(index => resolvedColor(`--viz-series-${index}`));
    const recordedX = data.recorded.map(point => point[0]);
    const recordedY = data.recorded.map(point => point[1]);
    const recordedZ = data.recorded.map(point => point[2]);
    const faceColumns = {
      i: data.hullFaces.map(face => face[0]),
      j: data.hullFaces.map(face => face[1]),
      k: data.hullFaces.map(face => face[2])
    };
    const edges = triangleEdges(data.hullFaces, recordedX, recordedY, recordedZ);
    const pathX = [];
    const pathY = [];
    const pathZ = [];
    data.segments.forEach(([start, end], index) => {
      if (index > 0) {
        pathX.push(null);
        pathY.push(null);
        pathZ.push(null);
      }
      pathX.push(...recordedX.slice(start, end));
      pathY.push(...recordedY.slice(start, end));
      pathZ.push(...recordedZ.slice(start, end));
    });
    const rays = representativeRays(data.rayAnchors, data.rayLengthM);

    const traces = [
      {
        type: 'mesh3d',
        name: '推断空间外包络',
        x: recordedX,
        y: recordedY,
        z: recordedZ,
        ...faceColumns,
        color: hullColor,
        opacity: 0.1,
        flatshading: true,
        hoverinfo: 'skip'
      },
      {
        type: 'scatter3d',
        mode: 'lines',
        x: edges.x,
        y: edges.y,
        z: edges.z,
        line: {color: hullColor, width: 1.1},
        opacity: 0.52,
        hoverinfo: 'skip',
        showlegend: false
      },
      {
        type: 'scatter3d',
        mode: 'lines',
        name: `${data.sourcePointCount} 点原始边界记录`,
        x: pathX,
        y: pathY,
        z: pathZ,
        line: {color: muted, width: 3},
        opacity: 0.75,
        hoverinfo: 'skip'
      }
    ];

    data.layers.forEach((layer, layerIndex) => {
      const points = data.planned.filter(point => point[3] === layer.id);
      traces.push({
        type: 'scatter3d',
        mode: 'markers',
        name: `${layer.label} · ${points.length} 点`,
        x: points.map(point => point[0]),
        y: points.map(point => point[1]),
        z: points.map(point => point[2]),
        customdata: points.map(point => [point[4], point[5], point[6]]),
        marker: {
          color: layerColors[layerIndex],
          size: 3.4,
          opacity: 0.94,
          symbol: layerIndex % 2 === 0 ? 'circle' : 'diamond'
        },
        hovertemplate: '点位 %{customdata[0]}<br>X %{x:.2f} m<br>Y %{y:.2f} m<br>Z %{z:.2f} m<br>基准 yaw %{customdata[1]:.1f}°<br>基准 pitch %{customdata[2]:.1f}°<extra></extra>'
      });
    });

    traces.push({
      type: 'scatter3d',
      mode: 'lines',
      name: '代表性倾斜视线',
      x: rays.x,
      y: rays.y,
      z: rays.z,
      line: {color: rayColor, width: 4},
      hoverinfo: 'skip'
    });

    const axis = (title, compact = false) => ({
      title: {text: title},
      color: foreground,
      gridcolor: border,
      zerolinecolor: border,
      showbackground: false,
      showticklabels: !compact,
      tickfont: {color: muted}
    });
    const layout = {
      autosize: true,
      margin: {l: narrow ? 56 : 0, r: narrow ? 80 : 0, t: 12, b: narrow ? 32 : 0},
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      font: {color: foreground},
      legend: {
        orientation: narrow ? 'v' : 'h',
        x: 0,
        y: narrow ? 0.99 : 1,
        xanchor: 'left',
        yanchor: narrow ? 'top' : 'bottom',
        font: {color: foreground, size: narrow ? 10 : 12},
        bgcolor: 'rgba(0,0,0,0)'
      },
      scene: {
        xaxis: axis('X（m）'),
        yaxis: axis(narrow ? '' : 'Y（m）', narrow),
        zaxis: axis(narrow ? '' : 'Z / 高度（m）', narrow),
        bgcolor: 'rgba(0,0,0,0)',
        aspectmode: 'data',
        camera: {
          eye: narrow
            ? {x: 0.7, y: -2.4, z: 1.1}
            : {x: 1.5, y: -1.75, z: 0.92}
        }
      }
    };
    summary.textContent = narrow
      ? `${data.planned.length} 空间点 × 22 视角 = ${data.planned.length * 22} 张 · ${data.layers.length} 层 · 内缩 ${data.clearanceM} m`
      : `${data.planned.length} 个空间点 · 每点 22 视角 · ${data.planned.length * 22} 张计划图片 · ${data.layers.length} 个错位高度层 · 全部位于外包络 ${data.clearanceM} m 安全边距内`;
    Plotly.react(plot, traces, layout, {
      responsive: true,
      displaylogo: false,
      scrollZoom: true
    });

  const resizeObserver = new ResizeObserver(() => Plotly.Plots.resize(plot));
  resizeObserver.observe(root);
  const themeObserver = new MutationObserver(draw);
  themeObserver.observe(document.documentElement, {attributes: true, attributeFilter: ['class', 'style']});
})();
</script>
